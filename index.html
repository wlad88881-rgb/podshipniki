<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подшипники</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --deepseek-color: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --warning: #f59e0b;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 30px;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            font-size: 1.2rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .db-badge {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .api-key-box {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .api-key-box input {
            padding: 6px 10px;
            font-size: 0.85rem;
            width: 220px;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #fff;
        }

        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .tab-btn.ds-tab.active {
            background: var(--deepseek-color);
            color: #fff;
            border-color: var(--deepseek-color);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .search-box {
            margin-bottom: 20px;
        }

        input[type="text"], input[type="password"], input[type="number"], select, textarea {
            width: 100%;
            padding: 12px 16px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .range-inputs {
            display: flex;
            gap: 8px;
        }

        .btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-ds {
            background: var(--deepseek-color);
            color: #fff;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            position: relative;
        }

        .card:hover {
            border-color: var(--accent);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent);
        }

        .card-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .fav-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.3rem;
        }

        .fav-btn.active {
            color: var(--warning);
        }

        .params-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }

        .param-item {
            display: flex;
            flex-direction: column;
        }

        .param-label {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .param-value {
            font-weight: 600;
        }

        .tag-saved {
            font-size: 0.7rem;
            background: rgba(99, 102, 241, 0.2);
            color: var(--deepseek-color);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(99, 102, 241, 0.4);
            margin-left: 6px;
        }

        .ai-response {
            background: var(--card-bg);
            border: 1px solid var(--deepseek-color);
            padding: 20px;
            border-radius: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            padding: 20px;
        }
    </style>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f172a"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<style>body{font-size:18px}.btn{padding:14px 22px}input[type="text"]{font-size:18px}</style>
</head>
<body>

<header>
    <div class="header-container">
        <h1>⚙️ ПодшипникИнфо <span class="db-badge" id="db-counter">База: 0</span></h1>
        <button id="install-btn" class="btn btn-ds" style="display:none" onclick="installApp()">📲 Установить</button>
    </div>
</header>

<div class="container">
    <div id="ios-hint" style="display:none;background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px">📲 Чтобы установить на iPhone: нажмите «Поделиться» (квадрат со стрелкой) → «На экран Домой».</div>
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('search')">🔍 Офлайн Поиск</button>
        <button class="tab-btn" onclick="switchTab('filter')">📐 Подбор по размерам</button>
        <button class="tab-btn ds-tab" onclick="switchTab('ai')">🤖 ИИ-помощник</button>
        <button class="tab-btn" onclick="switchTab('fav')">⭐ Избранное (<span id="fav-count">0</span>)</button>
    </div>

    <!-- Таб 1: Поиск -->
    <div id="tab-search" class="tab-content active">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Введите номер (204, 6204, 305, 7206, NU204, 3620)..." oninput="handleSearch()">
            <button class="btn btn-ds" style="margin-top:8px;width:100%" onclick="searchViaAI(document.getElementById('search-input').value.trim())">🤖 Найти с ИИ и сохранить в базу</button>
        </div>
        <div id="search-results" class="cards-grid"></div>
    </div>

    <!-- Таб 2: Подбор по размерам -->
    <div id="tab-filter" class="tab-content">
        <div class="filter-grid">
            <div class="filter-group">
                <label>Тип подшипника</label>
                <select id="filter-type" onchange="applyFilter()">
                    <option value="">Все типы</option>
                    <option value="Шариковый радиальный">Шариковый радиальный</option>
                    <option value="Роликовый конический">Роликовый конический</option>
                    <option value="Роликовый цилиндрический">Роликовый цилиндрический</option>
                    <option value="Упорный шариковый">Упорный шариковый</option>
                    <option value="Сферический двухрядный">Сферический двухрядный</option>
                </select>
            </div>
            <div class="filter-group">
                <label>d (Внутренний диаметр, мм)</label>
                <div class="range-inputs">
                    <input type="number" id="filter-d-min" placeholder="от" oninput="applyFilter()">
                    <input type="number" id="filter-d-max" placeholder="до" oninput="applyFilter()">
                </div>
            </div>
            <div class="filter-group">
                <label>D (Наружный диаметр, мм)</label>
                <div class="range-inputs">
                    <input type="number" id="filter-D-min" placeholder="от" oninput="applyFilter()">
                    <input type="number" id="filter-D-max" placeholder="до" oninput="applyFilter()">
                </div>
            </div>
            <div class="filter-group">
                <label>B/T (Ширина, мм)</label>
                <div class="range-inputs">
                    <input type="number" id="filter-B-min" placeholder="от" oninput="applyFilter()">
                    <input type="number" id="filter-B-max" placeholder="до" oninput="applyFilter()">
                </div>
            </div>
        </div>
        <div id="filter-results" class="cards-grid"></div>
    </div>

    <!-- Таб 3: ИИ AI -->
    <div id="tab-ai" class="tab-content">
        <div style="background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border);">
            <h3>Спросить ИИ</h3>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin: 8px 0 15px 0;">
                Найденный подшипник <b>автоматически сохранится в вашу офлайн-базу</b> со всеми размерами и характеристиками.
            </p>
            <textarea id="ai-prompt" rows="3" placeholder="Например: Найди характеристики и размеры подшипника 3620 по ГОСТ и его аналога ISO..."></textarea>
            <div style="margin-top: 10px; display: flex; gap: 10px;">
                <button class="btn btn-ds" onclick="askAI()">Запросить и сохранить в базу</button>
            </div>
            <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-outline" onclick="exportDB()">⬇ Экспорт базы</button><button class="btn btn-outline" onclick="importDB()">⬆ Импорт</button></div>
            <div id="ai-output-container" style="margin-top: 20px; display: none;">
                <div class="ai-response" id="ai-output"></div>
            </div>
        </div>
    </div>

    <!-- Таб 4: Избранное -->
    <div id="tab-fav" class="tab-content">
        <div id="fav-results" class="cards-grid"></div>
    </div>
</div>

<!-- Модальное окно -->
<div class="modal" id="modal-detail">
    <div class="modal-content">
        <div class="card-header">
            <div>
                <div class="card-title" id="modal-title"></div>
                <div class="card-subtitle" id="modal-subtitle"></div>
            </div>
            <button class="btn-outline" style="padding: 4px 8px;" onclick="closeModal()">✕</button>
        </div>
        <div id="modal-body"></div>
        <div style="margin-top: 15px; display: flex; gap: 10px;">
            <button class="btn btn-outline" style="flex: 1;" onclick="copyCardData()">📋 Скопировать</button>
            <button class="btn btn-ds" style="flex: 1; font-size: 0.85rem;" onclick="consultModalAI()">🤖 Запросить ИИ</button>
        </div>
    </div>
</div>

<script>
const T1="Шариковый радиальный",T2="Роликовый конический",T3="Упорный шариковый",T4="Роликовый цилиндрический",T5="Шариковый радиальный";
const bore=c=>c<4?[10,12,15,17][c]:c*5;
const DB=[];
const p2=c=>String(c).padStart(2,"0");
// A(тип, серия, префикс номера, первый код отверстия, [[D,B]...], функция ГОСТ|null)
function A(t,ser,pre,c0,rows,gf){rows.forEach((r,i)=>{const c=c0+i;DB.push({n:pre+p2(c),d:bore(c),D:r[0],B:r[1],t,ser,g:gf?String(gf(c)):""})})}
A(T1,"Сверхлёгкая узкая (618xx)","618",0,[[19,5],[21,5],[24,5],[26,5],[32,7],[37,7],[42,7],[47,7],[52,7],[58,7],[65,7],[72,9],[78,10],[85,10],[90,10],[95,10],[100,10]]);

A(T1,"Лёгкая (62xx)","62",0,[[30,9],[32,10],[35,11],[40,12],[47,14],[52,15],[62,16],[72,17],[80,18],[85,19],[90,20],[100,21],[110,22],[120,23],[125,24],[130,25],[140,26],[150,28],[160,30],[170,32],[180,34]],c=>200+c);

A(T3,"Лёгкая (511xx)","511",0,[[24,9],[26,9],[28,9],[30,9],[35,10],[42,11],[47,11],[52,12],[60,13],[65,14],[70,14]],c=>8100+c);
A(T3,"Средняя (512xx)","512",0,[[26,11],[28,11],[32,12],[35,12],[40,14],[47,15],[52,16],[62,18],[68,19],[73,20],[78,22]],c=>8200+c);
A(T4,"Лёгкая (NU2xx)","NU2",4,[[47,14],[52,15],[62,16],[72,17],[80,18],[85,19],[90,20]],c=>32200+c);
A(T4,"Средняя (NU3xx)","NU3",5,[[62,17],[72,19],[80,21],[90,23],[100,25],[110,27]],c=>32300+c);
[["604",4,12,4,1000094],["605",5,14,5,1000095],["606",6,17,6,1000096],["607",7,19,6,1000097],["608",8,22,7,1000098],["609",9,24,7,1000099],["623",3,10,4],["624",4,13,5],["625",5,16,5],["626",6,19,6],["627",7,22,7],["628",8,24,8],["629",9,26,8]]
 .forEach(x=>DB.push({n:x[0],d:x[1],D:x[2],B:x[3],t:T5,ser:"Миниатюрный",g:x[4]?String(x[4]):""}));

const SUF={"2RS":"Два контактных резиновых уплотнения","2RSR":"Два контактных резиновых уплотнения","2RS1":"Два контактных резиновых уплотнения","RS":"Одно резиновое уплотнение","RSR":"Одно резиновое уплотнение","2Z":"Две металлические защитные шайбы","ZZ":"Две металлические защитные шайбы","Z":"Одна защитная шайба","2RZ":"Два бесконтактных уплотнения","N":"Канавка под стопорное кольцо","NR":"Канавка и стопорное кольцо","C2":"Зазор меньше нормального","C0":"Нормальный зазор","C3":"Зазор больше нормального","C4":"Зазор значительно больше нормального","C5":"Зазор максимально увеличенный","P6":"Класс точности P6","P5":"Класс точности P5","P4":"Класс точности P4","P0":"Нормальный класс точности","K":"Конусное отверстие 1:12","M":"Латунный сепаратор","J":"Стальной штампованный сепаратор","TN9":"Полиамидный сепаратор","A":"Улучшенное исполнение (ГОСТ)"};
Object.assign(SUF,{AC:"Угол контакта 25–26°",B:"Угол контакта 40°",C:"Угол контакта 15°",E:"Усиленная конструкция",CC:"Улучшенная внутренняя конструкция",W33:"Смазочная канавка и отверстия в наружном кольце",MB:"Латунный сепаратор",CA:"Латунный сепаратор",MA:"Латунный сепаратор",TVP:"Полиамидный сепаратор",TVPB:"Полиамидный сепаратор"});

function R(t,ser,pre,rows,gf){rows.forEach(r=>DB.push({n:pre+p2(r[0]),d:bore(r[0]),D:r[1],B:r[2],t,ser,g:gf?String(gf(r[0])):""}))}
R(T1,"Особо лёгкая (60xx)","60",[[21,160,26],[22,170,28],[24,180,28],[26,200,33],[28,210,33],[30,225,35],[32,240,38]],c=>1000900+c);

R(T7,"Средняя (223xx)","223",[[8,90,33],[9,100,36],[10,110,40],[11,120,43],[12,130,46],[13,140,48],[14,150,51],[15,160,55],[16,170,58],[17,180,60],[18,190,64],[19,200,67],[20,215,73],[22,240,80],[24,260,86],[26,280,93],[28,300,102],[30,320,108]],c=>3600+c);
R(T8,"Лёгкая (12xx)","12",[[4,47,14],[5,52,15],[6,62,16],[7,72,17],[8,80,18],[9,85,19],[10,90,20],[11,100,21],[12,110,22]],c=>1200+c);

R(T2,"Лёгкая (302xx)","302",[[15,130,27.25],[16,140,28.25],[17,150,30.5],[18,160,32.5],[19,170,34.5],[20,180,37]],c=>7200+c);
R(T2,"Средняя (303xx)","303",[[11,120,31.5],[12,130,33.5],[13,140,36],[14,150,38],[15,160,40],[16,170,42.5]],c=>7300+c);
R(T2,"Повышенной грузоподъёмности (322xx)","322",[[4,47,19.25],[5,52,19.25],[6,62,21.25],[7,72,24.75],[8,80,24.75],[9,85,24.75],[10,90,24.75],[11,100,26.75],[12,110,29.75]],c=>7500+c);

}

function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    
    document.querySelectorAll('.tab-btn')[['search','filter','ai','fav'].indexOf(tabName)].classList.add('active');
    document.getElementById(`tab-${tabName}`).classList.add('active');

    if(tabName === 'fav') renderFavorites();
}

const SUFX={"2RS":"два резиновых уплотнения","2RSR":"два резиновых уплотнения","RS":"одно уплотнение","2Z":"две защитные шайбы","ZZ":"две защитные шайбы","Z":"одна защитная шайба","C2":"зазор меньше нормального","C3":"зазор больше нормального","C4":"зазор значительно больше нормального","P6":"класс точности P6","P5":"класс точности P5","P4":"класс точности P4","AC":"угол контакта 25°","A":"улучшенное исполнение (ГОСТ)","B":"угол контакта 40°","K":"конусное отверстие","M":"латунный сепаратор"};
function findBearings(q) {
    const keys = b => [String(b.iso).toUpperCase(), ...String(b.gost || "").toUpperCase().split(/\s*\/\s*/)];
    const rank = b => { const k = keys(b); return k.includes(q) ? 0 : k.some(x => x.startsWith(q)) ? 1 : k.some(x => x.includes(q)) ? 2 : 9; };
    const r = getFullDB().map(b => [rank(b), b]).filter(x => x[0] < 9).sort((a, b) => a[0] - b[0]);
    return (r.some(x => x[0] < 2) ? r.filter(x => x[0] < 2) : r).map(x => x[1]);
}
function handleSearch() {
    const raw = document.getElementById('search-input').value.trim().toUpperCase().replace(/\s+/g, "");
    const container = document.getElementById('search-results');
    if(!raw) { renderCards(getFullDB(), container); return; }
    let res = findBearings(raw), note = "";
    {
        const m = raw.match(/^((?:NU|NJ|NF|N)?\d{3,5})[-\/]?([A-Z0-9\-\/]+)$/);
        if(m && !res.some(b => [String(b.iso).toUpperCase(), ...String(b.gost || "").toUpperCase().split(/\s*\/\s*/)].includes(raw))) {
            const base = findBearings(m[1]);
            res = [...base, ...res.filter(b => !base.includes(b))];
            note = (m[2].match(/2RSR?|RS|2Z|ZZ|Z|C[0-5]|P[0-6]|AC|A|B|K|M/g) || []).map(x => `<span class="tag-saved">${x}: ${SUFX[x] || ""}</span>`).join(" ");
        }
    }
    if(!res.length) {
        container.innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; padding: 30px; background: var(--card-bg); border-radius: 12px; border: 1px dashed var(--deepseek-color);">
                <p style="margin-bottom: 10px;">В базе подшипник не найден.</p>
                <button class="btn btn-ds" onclick="searchViaAI(document.getElementById('search-input').value.trim())">🔍 Найти через ИИ и сохранить в базу</button>
            </div>`;
        return;
    }
    renderCards(res, container);
    if(note) container.insertAdjacentHTML('afterbegin', `<div style="grid-column:1/-1">${note}</div>`);
}

function renderCards(data, container) {
    const total = data.length; data = data.slice(0, 80);
    container.innerHTML = data.map(item => {
        const isFav = favorites.some(f => f.iso === item.iso);
        const isCustom = customDB.some(c => c.iso === item.iso);
        return `
            <div class="card" onclick="openModal('${item.iso}')">
                <div class="card-header">
                    <div>
                        <div class="card-title">${item.gost ? "ГОСТ " + item.gost + " / " : ""}${item.noiso ? "№ " : "ISO "}${item.iso}${isCustom ? '<span class="tag-saved">ИИ: проверить</span>' : ''}</div>
                        <div class="card-subtitle">${item.type || 'Подшипник'}</div>
                    </div>
                    <button class="fav-btn ${isFav ? 'active' : ''}" onclick="event.stopPropagation(); toggleFav('${item.iso}')">★</button>
                </div>
                <div class="params-list">
                    <div class="param-item"><span class="param-label">d (внутр.)</span><span class="param-value">${item.d} мм</span></div>
                    <div class="param-item"><span class="param-label">D (наруж.)</span><span class="param-value">${item.D} мм</span></div>
                    <div class="param-item"><span class="param-label">B (ширина)</span><span class="param-value">${item.B} мм</span></div>
                    <div class="param-item"><span class="param-label">Масса</span><span class="param-value">${item.weight ? item.weight + " кг" : "—"}</span></div>
                </div>
                <button class="btn btn-outline" style="width: 100%; font-size: 0.85rem;">Детали</button>
            </div>
        `;
    }).join('') + (total > 80 ? '<div style="grid-column:1/-1;color:var(--text-muted)">Показано 80 из ' + total + ': уточните запрос</div>' : '');
}

function saveBearingToLocalDB(o) {
    if(!o) return false;
    const iso = String(o.iso || "").trim().toUpperCase(), gost = String(o.gost || "").trim(), d = +o.d, D = +o.D, B = +o.B;
    const key = iso || gost;
    if(!key || !(d > 0 && D > d && B > 0)) return false;
    if(getFullDB().some(b => String(b.iso).toUpperCase() === key || (gost && String(b.gost || "").split(/\s*\/\s*/).includes(gost)))) return false;
    const n = v => +v > 0 ? +v : undefined;
    customDB.push({ iso: key, gost, d, D, B, weight: n(o.weight), C: n(o.C), C0: n(o.C0), speed: n(o.speed), type: o.type || "Подшипник" });
    localStorage.setItem('custom_bearing_db', JSON.stringify(customDB));
    updateCounter();
    return true;
}

function toggleFav(iso) {
    const item = getFullDB().find(b => String(b.iso) === String(iso));
    if(!item) return;
    const i = favorites.findIndex(f => String(f.iso) === String(iso));
    if(i >= 0) favorites.splice(i, 1); else favorites.push(item);
    localStorage.setItem('fav_bearings', JSON.stringify(favorites));
    updateFavCount(); handleSearch();
    if(document.getElementById('tab-fav').classList.contains('active')) renderFavorites();
}

function updateFavCount() {
    document.getElementById('fav-count').innerText = favorites.length;
}

function renderFavorites() {
    renderCards(favorites, document.getElementById('fav-results'));
}

function applyFilter() {
    const type = document.getElementById('filter-type').value;
    const dMin = parseFloat(document.getElementById('filter-d-min').value) || 0;
    const dMax = parseFloat(document.getElementById('filter-d-max').value) || Infinity;
    const DMin = parseFloat(document.getElementById('filter-D-min').value) || 0;
    const DMax = parseFloat(document.getElementById('filter-D-max').value) || Infinity;
    const BMin = parseFloat(document.getElementById('filter-B-min').value) || 0;
    const BMax = parseFloat(document.getElementById('filter-B-max').value) || Infinity;

    const filtered = getFullDB().filter(b => {
        if(type && b.type !== type) return false;
        if(b.d < dMin || b.d > dMax) return false;
        if(b.D < DMin || b.D > DMax) return false;
        if(b.B < BMin || b.B > BMax) return false;
        return true;
    });

    renderCards(filtered, document.getElementById('filter-results'));
}

function openModal(iso) {
    const item = getFullDB().find(b => String(b.iso) === String(iso));
    if(!item) return;

    currentModalItem = item;
    document.getElementById('modal-title').innerText = `${item.gost ? "ГОСТ " + item.gost + " / " : ""}${item.noiso ? "№ " : "ISO "}${item.iso}`;

function copyCardData() {
    if(!currentModalItem) return;
    const text = `Подшипник ISO ${currentModalItem.iso}${currentModalItem.gost ? " / ГОСТ " + currentModalItem.gost : ""}\nРазмеры: ${currentModalItem.d}x${currentModalItem.D}x${currentModalItem.B} мм`;
    navigator.clipboard.writeText(text).then(() => alert('Скопировано!'));
}

const AI_URL = "https://podshipniki-ai.wlad88881.workers.dev";  // адрес вашего Cloudflare Worker (один раз, см. README)
async function askAI() {
    const prompt = document.getElementById('ai-prompt').value.trim();
    if(!prompt) return;
    document.getElementById('ai-output-container').style.display = 'block';
    const out = document.getElementById('ai-output');
    if(!AI_URL) { out.innerText = 'ИИ пока не подключён.'; return; }
    if(!navigator.onLine) { out.innerText = 'Нет интернета. ИИ работает только онлайн, а база подшипников работает и без интернета.'; return; }
    out.innerText = '⌛ Ищу ответ… (до минуты)';
    try {
        const r = await fetch(AI_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ q: prompt }) });
        const o = await r.json();
        if(!r.ok) throw new Error(o.error || 'HTTP ' + r.status);
        const saved = saveBearingToLocalDB(o.bearing);
        out.innerText = (o.answer || '') + (saved ? '\n\n✅ Сохранено в базу на вашем телефоне (данные ИИ: сверьте с каталогом).' : '') + (!saved && o.bearing ? '\n\nℹ️ Такой подшипник уже есть в базе или данные неполные.' : '');
        handleSearch();
    } catch(e) {
        out.innerText = 'Не получилось: ' + e.message;
    }
}

function searchViaAI(query) {
    switchTab('ai');
    document.getElementById('ai-prompt').value = `Найди полные характеристики, размеры d, D, B и аналоги подшипника "${query}" по ГОСТ и ISO.`;
    askAI();
}

function consultModalAI() {
    if(!currentModalItem) return;
    closeModal();
    switchTab('ai');
    document.getElementById('ai-prompt').value = `Дай инженерные рекомендации по монтажу, допускам и зазорам для подшипника ${currentModalItem.iso}.`;
    askAI();
}
function exportDB() {
    if(!customDB.length) { alert('Своих подшипников пока нет'); return; }
    const t = JSON.stringify(customDB);
    navigator.clipboard.writeText(t).then(() => alert('Скопировано: ' + customDB.length + ' шт. Вставьте на другом устройстве через «Импорт».'), () => prompt('Скопируйте:', t));
}
function importDB() {
    const t = prompt('Вставьте экспортированный список:');
    if(!t) return;
    try { const n = JSON.parse(t).filter(saveBearingToLocalDB).length; alert('Добавлено: ' + n); handleSearch(); } catch(e) { alert('Не удалось прочитать список'); }
}
window.addEventListener('load', () => {
    document.getElementById('filter-type').innerHTML = '<option value="">Все типы</option>' + [...new Set(getFullDB().map(b => b.type))].map(t => `<option>${t}</option>`).join('');
});
let dp = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); dp = e; document.getElementById('install-btn').style.display = 'inline-block'; });
function installApp() { if(dp) { dp.prompt(); dp = null; document.getElementById('install-btn').style.display = 'none'; } }
if(/iphone|ipad/i.test(navigator.userAgent) && !navigator.standalone) document.getElementById('ios-hint').style.display = 'block';
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
